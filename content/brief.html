<dialog id="brief-dialog" aria-labelledby="brief-title">
      <div class="dialog-head">
        <h2 id="brief-title">Что указать в брифе?</h2>
        <button class="dialog-close" aria-label="Закрыть бриф">×</button>
      </div>
      <p class="short-answer">
        Бренд, аудиторию, задачу и основных конкурентов.
      </p>

      <p class="brief-privacy">
        Бриф формируется на вашем устройстве и не отправляется нам.
        <a href="privacy.html">Конфиденциальность</a> ·
        <a href="consent.html">Обработка данных</a>
      </p>
      <form class="brief-form">
        <label
          >Бренд или сайт<input
            name="brand"
            required
            maxlength="200"
            placeholder="Название или example.ru"
            autocomplete="organization" />
</label
        >
<label
          >Что вас интересует<select
            name="service"
            aria-label="Что вас интересует"
          >
            <option>Бесплатный разбор</option>
            <option>GEO-продвижение</option>
            <option>GEO-аудит</option>
          </select>
</label
        >
<label
          >Кто ваши клиенты?<input
            name="audience"
            maxlength="400"
            placeholder="Продукт, аудитория, география" />
</label
        >
<label
          >Задача и конкуренты<textarea
            name="task"
            maxlength="3000"
            placeholder="Что важно узнать или изменить?"
          >
</textarea>
</label
        >
<button class="btn primary" type="submit">
          Скачать бриф <span aria-hidden="true">↓</span>
        </button>
        <p class="brief-status" role="status" aria-live="polite">
</p>
      </form>
    </dialog>
